<section class="page-head"><div><span class="eyebrow">RECRUITER</span><h1>{{editMode ? "Edit Company" : "Add Company"}}</h1><p>Maintain complete recruiter and vacancy information.</p></div><a href="#!/companies" class="btn btn-light"><i class="bi bi-arrow-left"></i> Back</a></section>
<form class="panel form-panel" ng-submit="save()"><h3>Company Information</h3><div class="form-grid"><label>Company ID<input ng-model="form.id" disabled></label><label>Company Name *<input ng-model="form.name" required></label><label>Industry *<input ng-model="form.industry" required></label><label>Website<input type="url" ng-model="form.website"></label><label>HR Email<input type="email" ng-model="form.hrEmail"></label><label>HR Contact<input ng-model="form.hrContact"></label><label>City<input ng-model="form.city"></label><label>State<input ng-model="form.state"></label><label>Country<input ng-model="form.country"></label><label>Work Mode<select ng-model="form.workMode"><option>On-site</option><option>Hybrid</option><option>Remote</option></select></label></div><h3>Recruitment Details</h3><div class="form-grid"><label>Job Role *<input ng-model="form.jobRole" required></label><label>Eligibility<input ng-model="form.eligibility"></label><label>Minimum CGPA<input type="number" step="0.1" ng-model="form.minCgpa"></label><label>Experience<input ng-model="form.experience"></label><label>Open Positions<input type="number" ng-model="form.openPositions"></label><label>Status<select ng-model="form.status"><option>Active</option><option>Closed</option><option>On Hold</option></select></label><label>Average Package (LPA)<input type="number" step="0.1" ng-model="form.averagePackage"></label><label>Highest Package (LPA)<input type="number" step="0.1" ng-model="form.highestPackage"></label><label>Lowest Package (LPA)<input type="number" step="0.1" ng-model="form.lowestPackage"></label></div><div class="form-actions"><a href="#!/companies" class="btn btn-light">Cancel</a><button class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Company</button></div></form>
