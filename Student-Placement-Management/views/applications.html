<section class="page-head"><div><span class="eyebrow">TRACKING</span><h1>Applications</h1><p>Track every student application from submission to selection.</p></div></section>
<div class="panel form-panel"><h3>Create Application</h3><div class="form-grid compact"><label>Student *<select ng-model="form.studentId"><option value="">Select student</option><option ng-repeat="s in students" value="{{s.id}}">{{s.name}} — {{s.id}}</option></select></label><label>Company *<select ng-model="form.company"><option value="">Select company</option><option ng-repeat="c in companies">{{c.name}}</option></select></label><label>Job Role<input ng-model="form.role"></label><label>Apply Date<input type="date" ng-model="form.applyDate"></label><label>Status<select ng-model="form.status"><option>Applied</option><option>Shortlisted</option><option>Interview</option><option>Selected</option><option>Rejected</option></select></label><label>Package (LPA)<input type="number" step="0.1" ng-model="form.package"></label><label class="wide">Remarks<textarea ng-model="form.remarks"></textarea></label></div><button class="btn btn-primary" ng-click="add()"><i class="bi bi-plus-lg"></i> Add Application</button></div>
<div class="panel mt-4"><div class="table-responsive"><table class="table app-table"><thead><tr><th>ID</th><th>Student</th><th>Company</th><th>Role</th><th>Apply Date</th><th>Status</th><th>Package</th><th>Actions</th></tr></thead><tbody><tr ng-repeat="a in applications"><td><strong>{{a.id}}</strong></td><td>{{a.student}}</td><td>{{a.company}}</td><td>{{a.role}}</td><td>{{a.applyDate}}</td><td><span class="badge status-{{a.status | lowercase}}">{{a.status}}</span></td><td>{{a.package | currencyLPA}}</td><td><button class="action-btn danger" ng-click="remove(a)"><i class="bi bi-trash"></i></button></td></tr></tbody></table></div></div>
