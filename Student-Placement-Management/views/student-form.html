<section class="page-head"><div><span class="eyebrow">STUDENT</span><h1>{{editMode ? "Edit Student" : "Add Student"}}</h1><p>Enter accurate student and placement information.</p></div><a href="#!/students" class="btn btn-light"><i class="bi bi-arrow-left"></i> Back</a></section>
<form class="panel form-panel" ng-submit="save()"><h3>Personal Information</h3><div class="form-grid"><label>Student ID<input ng-model="form.id" disabled placeholder="Auto generated"></label><label>Full Name *<input ng-model="form.name" required></label><label>Email *<input type="email" ng-model="form.email" required></label><label>Phone<input ng-model="form.phone"></label><label>Gender<select ng-model="form.gender"><option>Female</option><option>Male</option><option>Other</option></select></label><label>Date of Birth<input type="date" ng-model="form.dob"></label><label>Location<input ng-model="form.location"></label><label>Batch<select ng-model="form.batch"><option>2027</option><option>2026</option><option>2028</option></select></label></div><h3>Academic Information</h3><div class="form-grid"><label>Department *<select ng-model="form.department" required><option value="">Select department</option><option ng-repeat="d in departments">{{d}}</option></select></label><label>CGPA *<input type="number" step="0.01" min="0" max="10" ng-model="form.cgpa" required></label><label>10th Percentage<input type="number" step="0.1" ng-model="form.tenth"></label><label>12th Percentage<input type="number" step="0.1" ng-model="form.twelfth"></label><label class="wide">Skills<input ng-model="form.skills" placeholder="Java, SQL, Python"></label></div><h3>Placement Information</h3><div class="form-grid"><label>Placement Status<select ng-model="form.placementStatus"><option>Not Placed</option><option>In Process</option><option>Placed</option></select></label><label>Application Status<select ng-model="form.applicationStatus"><option>Applied</option><option>Shortlisted</option><option>Interview</option><option>Selected</option><option>Rejected</option></select></label><label>Company<input ng-model="form.company"></label><label>Job Role<input ng-model="form.jobRole"></label><label>Package (LPA)<input type="number" step="0.1" ng-model="form.package"></label><label>Interview Date<input type="date" ng-model="form.interviewDate"></label><label class="wide">Interview Notes<textarea ng-model="form.interviewNotes"></textarea></label><label class="wide">Additional Notes<textarea ng-model="form.notes"></textarea></label></div><div class="form-actions"><a href="#!/students" class="btn btn-light">Cancel</a><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Save Student</button></div></form>
