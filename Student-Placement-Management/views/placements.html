<section class="page-head"><div><span class="eyebrow">OUTCOMES</span><h1>Placements</h1><p>Maintain confirmed placement records and salary packages.</p></div></section>
<div class="panel form-panel"><h3>Record Placement</h3><div class="form-grid compact"><label>Student *<select ng-model="form.student"><option value="">Select student</option><option ng-repeat="s in students">{{s.name}}</option></select></label><label>Company *<input ng-model="form.company" placeholder="Company name"></label><label>Job Role<input ng-model="form.role"></label><label>Package (LPA) *<input type="number" step="0.1" ng-model="form.package"></label><label>Joining Date<input type="date" ng-model="form.joiningDate"></label><label>Location<input ng-model="form.location"></label><label>Status<select ng-model="form.status"><option>Confirmed</option><option>Offer Received</option><option>Joined</option></select></label></div><button class="btn btn-primary" ng-click="add()"><i class="bi bi-award"></i> Record Placement</button></div>
<div class="panel mt-4"><div class="table-responsive"><table class="table app-table"><thead><tr><th>ID</th><th>Student</th><th>Company</th><th>Role</th><th>Package</th><th>Joining Date</th><th>Location</th><th>Status</th><th>Action</th></tr></thead><tbody><tr ng-repeat="p in placements"><td><strong>{{p.id}}</strong></td><td>{{p.student}}</td><td>{{p.company}}</td><td>{{p.role}}</td><td class="package">{{p.package | currencyLPA}}</td><td>{{p.joiningDate}}</td><td>{{p.location}}</td><td><span class="badge status-selected">{{p.status}}</span></td><td><button class="action-btn danger" ng-click="remove(p)"><i class="bi bi-trash"></i></button></td></tr></tbody></table></div></div>
